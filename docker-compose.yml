services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyfinance}
      POSTGRES_DB: ${POSTGRES_DB:-familyfinance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyfinance} -d ${POSTGRES_DB:-familyfinance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-familyfinance}:${POSTGRES_PASSWORD:-familyfinance}@db:5432/${POSTGRES_DB:-familyfinance}?sslmode=disable
      API_KEY: ${API_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt}
      SKIP_AUTH: ${SKIP_AUTH:-false}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_CALLBACK_URL: ${LINE_LOGIN_CALLBACK_URL:-http://localhost:3000/callback}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      RECEIPTS_DIR: /app/data/receipts
      MIGRATIONS_PATH: /app/migrations
    volumes:
      - receipts_data:/app/data/receipts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${API_KEY:-change-me-in-production}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
  receipts_data:
