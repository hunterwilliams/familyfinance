name: FamilyFinance
options:
  bundleIdPrefix: com.familyfinance
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  FamilyFinance:
    type: application
    platform: iOS
    sources:
      - FamilyFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyfinance.app
        INFOPLIST_KEY_NSCameraUsageDescription: "Capture paper receipts"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select receipt screenshots"
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyfinance.app.share
        INFOPLIST_KEY_NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
